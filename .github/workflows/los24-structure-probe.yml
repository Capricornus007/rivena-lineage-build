name: LOS 24.0 結構探測（rivena）

# 只做四件事：repo init（LineageOS 平台 manifest）→ 掛 rivena 的 local_manifests
# → repo sync（shallow + partial clone）→ lunch lineage_rivena-userdebug → m nothing
# （只建出構建圖，不出 ROM）。目的：量出「免費 runner 上這條路能不能站住」，不是出包。
# 只在手動觸發時跑（不排程：這台機器在牆外，GitHub 與 LineageOS 都直連得到，
# 沒有「趁網路能通時搶跑」的需求，排程只是白燒機時）。
# 完整 ROM 在免費前提下無解（Actions 每 job 6 小時、跑完清乾淨 119G、cache 每鍵 10G；
# 本機磁碟也不夠），crave 已關站、付費已由使用者排除。
#
# 座標依據（2026-11-04 實查，不是推測）：
#   · 平台 manifest 倉＝LineageOS/android，根目錄只有 default.xml 一個 manifest；
#     README.mkdn 的官方指令是 `repo init -u .../android.git -b lineage-24.0 --git-lfs`。
#     先前用的 LineageOS/manifest + lineage.xml 根本不存在（gh api 回 404）。GitHub 對
#     匿名 HTTPS 拉不存在的倉回的是「requires authentication」而不是 404，所以那三次紅
#     從來不是 git 設定問題，是倉名我憑空編的。
#   · rivena 不是 LineageOS 官方支援裝置（LineageOS/android_device_realme_rivena 也 404），
#     裝置 tree 全部來自 Capricornus007/local_manifests 的 lineage-24.0 分支。

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: LineageOS 最新分支
        type: string
        default: lineage-24.0
concurrency:
  group: los24-probe
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    name: repo sync + lunch + m nothing
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      MANIFEST_URL: https://github.com/LineageOS/android.git
      LOCAL_MANIFESTS_REPO: https://github.com/Capricornus007/local_manifests.git
      MANIFEST_BRANCH: ${{ inputs.manifest_branch || 'lineage-24.0' }}
      REPO_DIR: ${{ github.workspace }}/los
    steps:
      - name: 裝 repo / git-lfs 與依賴
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git git-lfs ccache rsync python3
          git lfs install --system || true
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: 清掉 runner 預裝的大塊，騰出同步空間
        run: |
          set -euo pipefail
          # ubuntu-latest 影像預裝的 Android SDK / .NET / Swift / hostedtoolcache 對這支
          # workflow 全無用；LOS 就算 shallow+partial 同步也要幾十 GB，先清再跑。
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache \
                     /usr/local/share/powershell /usr/share/swift || true
          sudo apt-get purge -y --auto-remove azure-cli google-cloud-cli \
                     microsoft-edge-stable firefox mysql-server-core || true
          sudo apt-get clean
          # docker 預載映像（runner 自帶的几個 base image）也吃根分區，清掉。
          sudo docker system prune -af || true
          df -h / | tail -1 | sed 's/^/清理後根分區：/'

      - name: 選工作目錄（根分區 vs /mnt 暫存碟）
        run: |
          set -euo pipefail
          # 上一輪（run 41690289419）死在 repo sync 寫爆根分區：job 註解是
          # System.IO.IOException: No space left on device，日誌那行
          # "Cannot initialize work tree for proprietary_vendor_realme_rivena" 只是它的表現。
          # 但 Azure 機型除了根分區還有一塊 ephemeral 暫存碟掛在 /mnt，標準 runner 上
          # 通常是幾百 GB——上一版我完全沒量它就斷定「裝不下」，這是漏的。
          # 這步把兩塊盤的可用量都印出來，哪塊夠大就用哪塊當工作目錄。
          df -h / /mnt 2>/dev/null || df -h /
          root_free=$(df --output=avail -BM / | tail -1 | tr -dc '0-9')
          mnt_free=0
          if [ -d /mnt ]; then
            sudo mkdir -p /mnt/los && sudo chown "$(id -u):$(id -g)" /mnt/los || true
            mnt_free=$(df --output=avail -BM /mnt | tail -1 | tr -dc '0-9')
          fi
          echo "根分區可用 ${root_free}M；/mnt 暫存碟可用 ${mnt_free}M"
          if [ "${mnt_free:-0}" -gt "${root_free:-0}" ] && [ "${mnt_free:-0}" -ge 120000 ]; then
            echo "REPO_DIR=/mnt/los" >> "$GITHUB_ENV"
            echo "::notice::改用 /mnt 暫存碟當工作目錄（可用 ${mnt_free}M）"
          else
            echo "REPO_DIR=$GITHUB_WORKSPACE/los" >> "$GITHUB_ENV"
            echo "::notice::/mnt 沒有比較大或不足 120G，沿用根分區（可用 ${root_free}M）"
          fi

      - name: 拉平台 manifest（shallow + partial clone）
        run: |
          set -euo pipefail
          # actions/checkout 會在 global gitconfig 寫 url.ssh://git@github.com/.insteadOf
          # = https://github.com/，repo 的 https URL 會被改写成 ssh:// 去要金鑰，
          # 非互動環境直接 "git requires authentication" 紅（run 41684810271 實測）。
          # 先把所有 insteadOf 覆寫清掉，讓 repo 用回 https 匿名抓取。
          for k in $(git config --global --get-regexp '^url\..*\.insteadOf$' | awk '{print $1}'); do
            git config --global --unset-all "$k"
          done
          git config --global --get-regexp '^url\..*\.insteadOf$' || echo "insteadOf 已全部清掉"
          mkdir -p "$REPO_DIR"
          cd "$REPO_DIR"
          # 不寫 -m：倉根目錄唯一的 manifest 就是 default.xml（實查），官方指令也沒有 -m。
          repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" \
            --git-lfs --depth=1 --partial-clone --clone-filter=blob:limit=10M

      - name: 掛 rivena 的 local_manifests
        run: |
          set -euo pipefail
          cd "$REPO_DIR"
          rm -rf .repo/local_manifests
          git clone --depth 1 -b "$MANIFEST_BRANCH" \
            "$LOCAL_MANIFESTS_REPO" .repo/local_manifests
          # 合併後先驗一次：重複 path（例如 device/lineage/sepolicy 已由 24.0 的
          # snippets/lineage.xml 自帶）會在這裡就報 duplicate，不用等 sync 跑到一半才炸。
          repo manifest -o /tmp/merged-manifest.xml
          echo "合併後專案數：$(grep -c '<project' /tmp/merged-manifest.xml)"
          for p in device/realme/rivena device/oppo/sm8250-common kernel/oppo/sm8250 \
                   hardware/oplus hardware/dolby vendor/realme/rivena \
                   vendor/oppo/sm8250-common vendor/oplus/camera; do
            grep -q "path=\"$p\"" /tmp/merged-manifest.xml \
              && echo "  OK  $p" || { echo "::error::local_manifests 沒帶進 $p"; exit 1; }
          done

      - name: repo sync
        run: |
          set -euo pipefail
          cd "$REPO_DIR"
          repo sync -c --no-tags --no-clone-bundle --optimized-fetch -j"$(nproc)" --fail-fast

      - name: 量體積與剩餘磁碟
        run: |
          set -euo pipefail
          cd "$REPO_DIR"
          du -sh . | sed 's/^/工作區體積：/'
          df -h / | tail -1 | sed 's/^/剩餘磁碟：/'

      - name: lunch lineage_rivena-userdebug
        id: lunch
        run: |
          set -euo pipefail
          cd "$REPO_DIR"
          test -d device/realme/rivena || { echo "::error::device/realme/rivena 不存在"; exit 1; }
          set +u
          source build/envsetup.sh
          lunch lineage_rivena-userdebug
          set -u
          {
            echo "TARGET_PRODUCT=$TARGET_PRODUCT"
            echo "TARGET_DEVICE=$TARGET_DEVICE"
          } >> "$GITHUB_OUTPUT"

      - name: m nothing（只建構建圖，不出 ROM）
        run: |
          set -euo pipefail
          cd "$REPO_DIR"
          set +u; source build/envsetup.sh; lunch lineage_rivena-userdebug; set -u
          m nothing

      - name: 結果摘要
        if: always()
        run: |
          {
            echo "## LOS 24.0 結構探測"
            echo "- 平台 manifest：LineageOS/android @ $MANIFEST_BRANCH（default.xml，--git-lfs）"
            echo "- 裝置 tree：Capricornus007/local_manifests（rivena 非 LOS 官方支援裝置）"
            echo "- 結論：sync / lunch / m nothing 三步的成敗見上方 job 列表"
            echo "- 這支 workflow 不出 ROM，只量可行邊界"
          } >> "$GITHUB_STEP_SUMMARY"
